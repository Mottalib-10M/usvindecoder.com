name: Données fédérales et déploiement

# Chaque lundi : relève le fichier des rappels NHTSA, les notes NCAP, la consommation EPA et la table
# WMI, relance les tests, reconstruit et republie le site. Aucune clé d'API : toutes les sources sont publiques.
on:
  push:
    branches: ['main']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relevé des données officielles (hebdomadaire ou manuel)
        if: github.event_name != 'push'
        run: |
          python3 scripts/data/build-recalls.py
          python3 scripts/data/build-epa.py
          python3 scripts/data/build-ncap.py
          python3 scripts/data/build-wmi.py
          python3 scripts/data/build-samples.py
      - run: npm ci
      - name: Tests du moteur
        run: npx vitest run
      - name: Build (avec contrôle des snippets)
        run: npm run build
      - name: Enregistre les données relevées
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/gen
          git diff --cached --quiet || (git commit -m "Données fédérales : relevé hebdomadaire" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
